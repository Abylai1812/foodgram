volumes:
  pg_data_production:
  static_volume:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data

  backend:
    image: juniorabylai/foodgram_backend
    env_file: .env
    volumes:
      - static_volume:/staticfiles
      - ./data/:/app/data/

  frontend:
    container_name: foodgram-front
    image: juniorabylai/foodgram_frontend
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static

  nginx:
    container_name: foodgram-proxy
    image: juniorabylai/foodgram_gateway
    env_file: .env
    ports:
      - "9090:80"